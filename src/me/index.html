<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人主页 · GitHub 热门项目中文榜</title>
<meta name="description" content="查看你收藏的 GitHub 热门项目、B 站关联状态，以及可分享的公开收藏页。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6feb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6feb'/%3E%3Ctext x='32' y='43' font-family='sans-serif' font-size='30' font-weight='700' fill='white' text-anchor='middle'%3EGH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">GH</span>
      <div>
        <h1 id="page-title">个人主页</h1>
        <p id="page-subtitle">收藏的项目 · B 站关联 · 账号设置</p>
      </div>
    </div>
    <a class="icon-button" href="../">← 回到榜单</a>
    <div class="auth" id="auth-slot" aria-live="polite"></div>
  </div>
</header>

<main class="layout layout--single" id="main">
  <div id="notice-slot"></div>

  <section id="profile-slot" hidden></section>

  <section class="section" id="favorites-section">
    <div class="section-head">
      <span class="emoji" aria-hidden="true">⭐</span>
      <h2 id="fav-title">我的收藏</h2>
      <span class="badge" id="fav-count">0 个</span>
      <div class="field fav-tools">
        <label for="fav-q">筛选</label>
        <input type="search" id="fav-q" placeholder="项目名 / 描述 / 标签" autocomplete="off">
        <label for="fav-sort">排序</label>
        <select id="fav-sort">
          <option value="saved">最近收藏</option>
          <option value="star">Star 最多</option>
          <option value="name">名称</option>
        </select>
      </div>
    </div>
    <div class="card-grid" id="fav-grid"></div>
  </section>
</main>

<footer class="site-footer">
  <p id="footer-hint">
    收藏数据保存在本站 KV 中，展示为「收藏那一刻」的项目快照（Star 数不会自动刷新，点项目名可查看最新数据）。
    公开收藏页地址形如 <code>/me/?u=你的GitHub用户名</code>，可在下方一键复制。
  </p>
</footer>

<script type="module" src="./me.js"></script>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
