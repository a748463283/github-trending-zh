name = "github-trending-zh"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

# 变量：生产环境请在 Cloudflare Pages 控制台 -> Settings -> Environment variables 里配置
#   GH_TOKEN             GitHub 个人访问令牌（只读 public_repo 即可），可选，把接口限额提到 30 次/分
#   BILI_COOKIE          B 站 Cookie，可选，降低风控概率
#   GITHUB_CLIENT_ID     GitHub 登录用（OAuth App），可选
#   GITHUB_CLIENT_SECRET GitHub 登录用（OAuth App），可选
#   SESSION_SECRET       会话签名密钥，可选（不设则退回用 GITHUB_CLIENT_SECRET 作密钥）
# 说明：这些变量不在 [vars] 里写死（属于机密），只在控制台/CI 里注入。
# 通过命令行本地调试时，写入 .dev.vars（已在 .gitignore 中忽略）

[vars]
# 每个周期抓取的仓库数量上限
FETCH_LIMIT = "100"
# 聚合结果缓存秒数（3 小时：KV 免费额度是 1000 次写/天，缓存越久写入越少）
CACHE_TTL = "10800"
# 单次刷新最多为多少个仓库记录 Star 采样点（保护 KV 写额度，给登录/收藏留余量）
STAR_SAMPLE_LIMIT = "40"

# KV：仅用于缓存（聚合结果 / 翻译 / 教程 / Star 采样）
[[kv_namespaces]]
binding = "TRENDING_KV"
id = "539ce7d9ab62424a88d62fd6ec0aa552"

# D1（SQLite）：用户 / 收藏 / B 站绑定
# 为什么用户数据放 D1：KV 免费额度只有 1000 次写/天，容易被缓存写入吃光；
# D1 免费额度是 10 万行写/天，适合随用户操作频繁写入的数据。
#
# 启用步骤（三步）：
#   1) npx wrangler d1 create github-trending-zh-users     # 记下返回的 database_id
#   2) 把下面的 [[d1_databases]] 取消注释并填入 database_id
#   3) npx wrangler d1 migrations apply github-trending-zh-users --remote
#
# 没绑定 D1 时程序会自动回退到 KV 存放用户数据（功能不变，只是写入额度小）。

[[d1_databases]]
binding = "USER_DB"
database_name = "github-trending-zh-users"
database_id = "8d097c1b-38ca-473b-928e-63902ddc05e1"

# Workers AI：英文描述 -> 中文翻译
[ai]
binding = "AI"
